[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-automation-studio"
version = "0.1.0"
description = "Local-first multi-channel YouTube research and production desktop application"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "YouTube Automation Studio" }]
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "keyring>=24.3.0",
    "mutagen>=1.47.0",
    "Pillow>=10.1.0",
    "numpy>=1.26.0",
    "python-dateutil>=2.8.2",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "types-Pillow",
]
ai = [
    # Optional local AI runtimes – install only when needed
    # "llama-cpp-python",
    # "sentence-transformers",
    # "diffusers",
    # "torch",
]

[project.scripts]
youtube-studio = "youtube_studio.main:main"
youtube-studio-mcp = "youtube_studio.mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["youtube_studio"]
